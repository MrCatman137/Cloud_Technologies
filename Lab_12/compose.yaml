services:
  redis:
    image: redis:7-alpine
    container_name: lab12-redis
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  app:
    image: python:3.11-alpine
    container_name: lab12-web-app
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir flask redis && python app.py"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge